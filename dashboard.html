{% extends 'layout.html' %}
{% block content %}
<!-- Alerts -->
<div class="bg-red-900/40 border border-red-500/50 rounded-xl p-4 flex items-center justify-between mb-8 shadow-lg shadow-red-900/20">
    <div class="flex items-center">
        <div class="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center mr-4">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-xl animate-pulse"></i>
        </div>
        <div>
            <h3 class="text-red-400 font-bold">HIGH RISK TRANSACTION DETECTED</h3>
            <p class="text-slate-300 text-sm">₹28,900 at Unknown Merchant (Mumbai). Risk Score: 87%</p>
        </div>
    </div>
    <div class="flex space-x-3">
        <button class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-sm transition">Mark as Safe</button>
        <button class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm shadow-lg shadow-red-900/50 transition">Block Demo Transaction</button>
    </div>
</div>
<!-- Stats -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <div class="glass-card rounded-xl p-6 relative overflow-hidden group">
        <div class="absolute top-0 right-0 w-24 h-24 bg-blue-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
        <p class="text-slate-400 text-sm mb-1">Total Transactions</p>
        <h3 class="text-3xl font-bold text-white">{{ stats.total_txns }}</h3>
        <p class="text-xs text-slate-500 mt-2">Last updated: Today</p>
        <i class="fa-solid fa-right-left absolute bottom-6 right-6 text-slate-700 text-3xl group-hover:text-blue-500/30 transition"></i>
    </div>
    <div class="glass-card rounded-xl p-6 relative overflow-hidden group">
        <div class="absolute top-0 right-0 w-24 h-24 bg-cyan-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
        <p class="text-slate-400 text-sm mb-1">Total Spending</p>
        <h3 class="text-3xl font-bold text-white">₹{{ stats.total_spending }}</h3>
        <p class="text-xs text-slate-500 mt-2">Last updated: Today</p>
        <i class="fa-solid fa-indian-rupee-sign absolute bottom-6 right-6 text-slate-700 text-3xl group-hover:text-cyan-500/30 transition"></i>
