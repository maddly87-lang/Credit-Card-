{% extends 'layout.html' %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-2">Daily Spending Flow</h1>
    <p class="text-slate-400 mb-8">Analyzing routine patterns vs anomalies</p>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass-card rounded-xl p-6 text-center border-t-4 border-t-blue-500">
            <div class="text-slate-400 text-sm">Today's Spending</div>
            <div class="text-3xl font-bold text-white mt-2">₹4,250</div>
        </div>
        <div class="glass-card rounded-xl p-6 text-center border-t-4 border-t-cyan-500">
            <div class="text-slate-400 text-sm">This Week</div>
            <div class="text-3xl font-bold text-white mt-2">₹12,850</div>
        </div>
        <div class="glass-card rounded-xl p-6 text-center border-t-4 border-t-indigo-500">
            <div class="text-slate-400 text-sm">Available Demo Limit</div>
            <div class="text-3xl font-bold text-white mt-2">₹1,00,000</div>
        </div>
    </div>
    <!-- Timeline -->
    <div class="glass-card rounded-xl p-8 relative">
        <div class="absolute left-8 md:left-24 top-12 bottom-12 w-0.5 bg-slate-700"></div>
        
        <div class="space-y-8 relative">
            <!-- Normal -->
            <div class="flex items-start">
                <div class="w-16 md:w-24 text-right pr-6 text-slate-400 text-sm pt-1">08:30 AM</div>
                <div class="w-4 h-4 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.5)] z-10 -ml-[9px] mt-1.5 border-4 border-[#0b1120]"></div>
                <div class="ml-6 bg-slate-800/50 p-4 rounded-lg border border-slate-700 flex-1">
                    <div class="flex justify-between">
                        <div class="font-bold text-slate-200">Coffee Shop</div>
                        <div class="font-bold">₹120</div>
                    </div>
                    <div class="text-xs text-green-400 mt-1">Low Risk • Routine Transaction</div>
